name: Build

on:
  push:
    branches: [ master ]
    tags: ['*']
    paths-ignore: ['**.md']
  pull_request:
    branches: [ master ]
    paths-ignore: ['**.md']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg_cache,readwrite"

jobs:
  build:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    defaults:
      run:
        shell: ${{ matrix.config.shell }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: MSVC x64 Release (vcpkg)
            os: windows-2022
            shell: pwsh
            type: vcpkg
            build-type: Release
            triplet: x64-windows-static-release
            arch: x64
            artifact-name: Win-64-Release
            artifact-path: build/*.zip
            extra-options: >-
              -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake"
              -DVCPKG_TARGET_TRIPLET=x64-windows-static-release
              -DWITH_DISCORD_RPC=ON
              -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
              -DCMAKE_IGNORE_PATH="C:/Strawberry/perl/bin;C:/Strawberry/c/lib"
              -DENABLE_WERROR=ON -DENABLE_HARDENING=ON -DENABLE_LTO=ON

          - name: MSVC x64 Debug (vcpkg)
            os: windows-2022
            shell: pwsh
            type: vcpkg
            build-type: Debug
            triplet: x64-windows-static
            arch: x64
            artifact-name: Win-64-Debug
            artifact-path: build/*.zip
            extra-options: >-
              -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_INSTALLATION_ROOT}/scripts/buildsystems/vcpkg.cmake"
              -DVCPKG_TARGET_TRIPLET=x64-windows-static
              -DWITH_DISCORD_RPC=ON
              -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
              -DCMAKE_IGNORE_PATH="C:/Strawberry/perl/bin;C:/Strawberry/c/lib"

    steps:
      - name: Developer Command Prompt (MSVC)
        if: runner.os == 'Windows' && matrix.config.type == 'vcpkg'
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.config.arch }}

      - uses: actions/checkout@v7

      - name: Restore vcpkg cache
        id: cache-vcpkg
        if: matrix.config.type == 'vcpkg'
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.config.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'overlay-ports/**') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ matrix.config.triplet }}-

      - name: Configure
        run: >-
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.config.build-type }}
          ${{ matrix.config.extra-options }}

      - name: Build
        run: cmake --build build

      - name: Delete old vcpkg cache
        continue-on-error: true
        if: matrix.config.type == 'vcpkg' && github.event_name == 'push' && github.ref == 'refs/heads/master' && steps.cache-vcpkg.outputs.cache-hit
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh cache delete --repo ${{ github.repository }} ${{ steps.cache-vcpkg.outputs.cache-primary-key }}

      - name: Save vcpkg cache
        # pull requests are restore-only: an entry saved from a PR is scoped to
        # refs/pull/N/merge and is invisible to master and to other pull requests
        if: matrix.config.type == 'vcpkg' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: ${{ steps.cache-vcpkg.outputs.cache-primary-key }}

      - name: Restore demotest cache
        id: cache-demotest
        uses: actions/cache/restore@v6
        with:
          path: demotest/extract
          key: demotest-${{ hashFiles('demotest/config.toml') }}

      - name: Test
        run: |
          cd demotest
          python demotest --jobs 4 --port ../build/src/woof

      - name: Save demotest cache
        if: steps.cache-demotest.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/cache/save@v6
        with:
          path: demotest/extract
          key: demotest-${{ hashFiles('demotest/config.toml') }}

      - name: Package
        run: |
          cd build
          cpack -C ${{ matrix.config.build-type }}

      - name: Upload Artifacts
        if: matrix.config.artifact-path
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.config.artifact-name }}
          path: ${{ matrix.config.artifact-path }}

  release:
    name: Release
    needs: build
    if: contains(github.ref, 'tags')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Extract Version Number
        run: echo "VERSION=${GITHUB_REF##*_}" >> $GITHUB_ENV

      - name: Release
        uses: ncipollo/release-action@v1
        with:
          name: Woof! ${{ env.VERSION }}
          bodyFile: CHANGELOG.md
          allowUpdates: true
          artifacts: artifacts/Win-64-Release/*
